name: One-time App split

on:
  push:
    branches:
      - agent/split-app-tsx
    paths:
      - scripts/refactor-app-split.py
      - .github/workflows/refactor-app-split.yml

permissions:
  contents: write

jobs:
  split-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/split-app-tsx
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Split App.tsx
        run: python scripts/refactor-app-split.py
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes generated"
            exit 1
          fi
          git commit -m "Split App presentation views from orchestration"
          git push origin HEAD:agent/split-app-tsx
