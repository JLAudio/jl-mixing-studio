name: PR81 migrate legacy compatibility tests v2
on:
  push:
    branches: [agent/automation-api-discovery]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automation-api-discovery
      - name: Migrate legacy test harness
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/cli.rs')
          s = p.read_text()

          # Runtime no longer needs these legacy version-file imports.
          s = s.replace('#[cfg(test)]\nuse std::env;\nuse std::ffi::OsStr;\nuse std::fs;\nuse std::io;\nuse std::path::{Path, PathBuf};',
                        '#[cfg(test)]\nuse std::{env, path::PathBuf};\nuse std::io;\nuse std::path::Path;')

          # Update the fake installation: no VERSION metadata; install the API entry point.
          start = s.index('    fn installed_home(version: &str) -> tempfile::TempDir {')
          end = s.index('\n    #[test]', start)
          replacement = '''    fn installed_home(_version: &str) -> tempfile::TempDir {\n        let home = tempfile::tempdir().unwrap();\n        let bin = home.path().join(".local/bin");\n        std::fs::create_dir_all(&bin).unwrap();\n        for executable in [\n            "jl-mixing",\n            CLIENT_EXECUTABLE,\n            STUDIO_EXECUTABLE,\n            PROJECT_EXECUTABLE,\n            INTAKE_EXECUTABLE,\n            DELIVERY_EXECUTABLE,\n            REVISION_EXECUTABLE,\n            APPROVAL_EXECUTABLE,\n        ] {\n            std::fs::write(bin.join(executable), "managed launcher").unwrap();\n        }\n        home\n    }\n\n    fn discovery_output() -> ProcessResult {\n        ProcessResult {\n            success: true,\n            exit_code: Some(0),\n            stdout: r#"{\"api_version\":\"1.0\",\"application\":{\"name\":\"jl-mixing\",\"version\":\"9.9.9\"},\"capabilities\":[\"system.info\",\"client.create\",\"project.create\",\"revision.create\",\"intake.validate\",\"revision.approve\",\"delivery.create\"]}"#.into(),\n            stderr: String::new(),\n        }\n    }\n'''
          s = s[:start] + replacement + s[end:]

          # API discovery is infrastructure for every operation. Answer it automatically so
          # existing operation tests keep their queued result focused on the operation itself.
          needle = '''            self.invocations.borrow_mut().push(Invocation {\n                executable: executable.to_owned(),\n                arguments: arguments.to_vec(),\n                current_directory: current_directory.map(Path::to_owned),\n            });\n            self.results\n                .borrow_mut()\n                .pop_front()\n                .expect("a fake process result")'''
          repl = '''            self.invocations.borrow_mut().push(Invocation {\n                executable: executable.to_owned(),\n                arguments: arguments.to_vec(),\n                current_directory: current_directory.map(Path::to_owned),\n            });\n            if arguments == ["system-info", "--json"] {\n                return Ok(discovery_output());\n            }\n            self.results\n                .borrow_mut()\n                .pop_front()\n                .expect("a fake process result")'''
          if needle not in s:
              raise SystemExit('FakeRunner block not found')
          s = s.replace(needle, repl, 1)

          # Remove tests that specifically assert the retired product VERSION-file mechanism.
          obsolete = [
              'accepts_only_the_released_supported_version_for_creation',
              'rejects_unrecognized_version_output',
              'reports_missing_executable_without_exposing_system_details',
              'rejects_missing_or_invalid_version_metadata_without_running_a_command',
              'checks_new_client_health_after_reading_the_installed_version',
          ]
          for name in obsolete:
              marker = f'    #[test]\n    fn {name}()'
              start = s.find(marker)
              if start == -1:
                  continue
              next_test = s.find('    #[test]\n', start + len(marker))
              if next_test == -1:
                  raise SystemExit(f'cannot find end of obsolete test {name}')
              s = s[:start] + s[next_test:]

          # Custom-prefix resolution still matters, but the VERSION-path assertion does not.
          old = '''        assert_eq!(executable, bin.join(CLIENT_EXECUTABLE));\n        assert_eq!(\n            version_file_for_command(&executable),\n            Some(prefix.path().join("share/jl-mixing/VERSION"))\n        );'''
          s = s.replace(old, '        assert_eq!(executable, bin.join(CLIENT_EXECUTABLE));')

          # Keep existing fixtures readable without tying them to provider product compatibility.
          s = s.replace('SUPPORTED_VERSION', '"1.3.1"')

          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/cli.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate CLI tests to Automation API discovery'
          git push