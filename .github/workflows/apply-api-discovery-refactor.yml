name: Apply API discovery refactor
on:
  push:
    branches: [agent/automation-api-discovery]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automation-api-discovery
      - name: Wire compatibility check
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/cli.rs')
          s = p.read_text()
          start = s.index('fn check_version_with_runner<R: ProcessRunner>')
          end = s.index('fn bounded_process_message', start)
          replacement = '''fn check_version_with_runner<R: ProcessRunner>(home: &Path, runner: &R) -> VersionCheck {\n    crate::automation_api::check_automation_compatibility(home, runner)\n}\n\n'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('const VERSION_FILE: &str = "VERSION";\n', '')
          s = s.replace('const SUPPORTED_VERSION: &str = "1.3.1";\n', '')
          s = s.replace('const MAX_VERSION_FILE_BYTES: usize = 64;\n', '')
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/cli.rs
          git commit -m 'Use Automation API discovery for compatibility checks' || exit 0
          git push
