name: PR81 format fix
on:
  push:
    branches: [agent/automation-api-discovery]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automation-api-discovery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/automation_api.rs src-tauri/src/cli.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Format Automation API discovery changes'
          git push
