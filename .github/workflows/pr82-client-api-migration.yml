name: Client API consumer migration

on:
  push:
    branches: [agent/client-create-api-consumer]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-create-api-consumer
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply client API migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          api = Path('src-tauri/src/automation_api.rs')
          s = api.read_text()
          s = s.replace('const AUTOMATION_EXECUTABLE: &str = "jl-mixing";', 'pub(crate) const AUTOMATION_EXECUTABLE: &str = "jl-mixing";', 1)
          marker = '''pub(crate) fn check_automation_compatibility<R: ProcessRunner>(
              home: &Path,
              runner: &R,
          ) -> VersionCheck {'''
          if marker not in s:
              raise SystemExit('automation API insertion marker not found')
          addition = r'''#[derive(Debug, Clone, Copy, Deserialize, PartialEq, Eq)]
          #[serde(rename_all = "lowercase")]
          pub(crate) enum ApiStatus {
              Success,
              Planned,
              Blocked,
              Error,
          }

          #[derive(Debug, Deserialize)]
          pub(crate) struct ApiError {
              pub(crate) code: String,
              pub(crate) message: String,
          }

          #[derive(Debug, Deserialize)]
          pub(crate) struct ApiResponse {
              api_version: String,
              operation: String,
              pub(crate) status: ApiStatus,
              pub(crate) data: serde_json::Value,
              pub(crate) errors: Vec<ApiError>,
          }

          #[derive(Debug, PartialEq, Eq)]
          pub(crate) enum ApiCallError {
              Unavailable,
              StartFailed,
              Malformed,
              IncompatibleVersion(String),
              UnexpectedOperation(String),
          }

          impl ApiCallError {
              pub(crate) fn message(&self) -> String {
                  match self {
                      Self::Unavailable => "JL Mixing Automation was not found in its default install location or on PATH".into(),
                      Self::StartFailed => "JL Mixing Automation could not be started".into(),
                      Self::Malformed => "JL Mixing Automation returned a malformed API response".into(),
                      Self::IncompatibleVersion(version) => format!(
                          "JL Mixing Automation returned API {}; Studio requires Automation API {}",
                          version, SUPPORTED_API_VERSION
                      ),
                      Self::UnexpectedOperation(operation) => format!(
                          "JL Mixing Automation returned an unexpected API operation: {}",
                          operation
                      ),
                  }
              }
          }

          pub(crate) fn invoke_api<R: ProcessRunner>(
              home: &Path,
              expected_operation: &str,
              arguments: &[String],
              current_directory: Option<&Path>,
              runner: &R,
          ) -> Result<ApiResponse, ApiCallError> {
              let Some(executable) = resolve_command(home, AUTOMATION_EXECUTABLE) else {
                  return Err(ApiCallError::Unavailable);
              };
              let output = runner
                  .run(&executable, arguments, current_directory)
                  .map_err(|error| {
                      if error.kind() == io::ErrorKind::NotFound {
                          ApiCallError::Unavailable
                      } else {
                          ApiCallError::StartFailed
                      }
                  })?;
              let response: ApiResponse =
                  serde_json::from_str(output.stdout.trim()).map_err(|_| ApiCallError::Malformed)?;
              if response.api_version != SUPPORTED_API_VERSION {
                  return Err(ApiCallError::IncompatibleVersion(response.api_version));
              }
              if response.operation != expected_operation {
                  return Err(ApiCallError::UnexpectedOperation(response.operation));
              }
              Ok(response)
          }

          '''
          s = s.replace(marker, addition + marker, 1)
          api.write_text(s)

          cli = Path('src-tauri/src/cli.rs')
          s = cli.read_text()
          old_import = 'use crate::automation_api::{resolve_command, ProcessResult, ProcessRunner, SystemProcessRunner};'
          new_import = '''use crate::automation_api::{
              invoke_api, resolve_command, ApiCallError, ApiStatus, ProcessResult, ProcessRunner,
              SystemProcessRunner, AUTOMATION_EXECUTABLE,
          };'''
          if old_import not in s:
              raise SystemExit('cli import marker not found')
          s = s.replace(old_import, new_import, 1)
          s = s.replace('const CLIENT_EXECUTABLE: &str = "new-client";\n', '', 1)

          run_pattern = re.compile(r'''(?ms)^fn run_client_operation<R: ProcessRunner>\(.*?^}\n\n(?=fn run_studio_operation)''')
          match = run_pattern.search(s)
          if not match:
              raise SystemExit('run_client_operation block not found')
          replacement = r'''fn run_client_operation<R: ProcessRunner>(
              home: &Path,
              workspace: &Path,
              request: ClientCreationRequest,
              operation: ClientOperation,
              runner: &R,
          ) -> ClientOperationResult {
              let client = match normalize_request(request) {
                  Ok(client) => client,
                  Err(message) => {
                      return blocked_client_operation(ClientOperationCode::InvalidInput, &message)
                  }
              };

              let version = check_version_with_runner(home, runner);
              if !version.available {
                  return blocked_client_operation(
                      ClientOperationCode::AutomationUnavailable,
                      &version.message,
                  );
              }
              if !version.supported {
                  return blocked_client_operation(ClientOperationCode::UnsupportedVersion, &version.message);
              }
              if !version.client_creation_supported {
                  return blocked_client_operation(
                      ClientOperationCode::Rejected,
                      "JL Mixing Automation does not advertise the client.create capability",
                  );
              }

              let arguments = client_arguments(&client, operation);
              match invoke_api(
                  home,
                  "client.create",
                  &arguments,
                  Some(workspace),
                  runner,
              ) {
                  Ok(response)
                      if matches!(
                          (operation, response.status),
                          (ClientOperation::Preflight, ApiStatus::Planned)
                              | (ClientOperation::Create, ApiStatus::Success)
                      ) => {
                          let returned_id = response
                              .data
                              .get("client")
                              .and_then(|value| value.get("id"))
                              .and_then(|value| value.as_str());
                          if returned_id != Some(client.client_id.as_str()) {
                              return blocked_client_operation(
                                  ClientOperationCode::Failed,
                                  "JL Mixing Automation returned a client identity that did not match the request",
                              );
                          }
                          ClientOperationResult {
                              ok: true,
                              code: match operation {
                                  ClientOperation::Preflight => ClientOperationCode::Ready,
                                  ClientOperation::Create => ClientOperationCode::Created,
                              },
                              message: match operation {
                                  ClientOperation::Preflight => "Preflight passed. No changes were made.",
                                  ClientOperation::Create => "Client created successfully.",
                              }
                              .to_owned(),
                              client: Some(client),
                          }
                      }
                  Ok(response) => rejected_client_api_response(response, client),
                  Err(ApiCallError::Unavailable) => blocked_client_operation(
                      ClientOperationCode::AutomationUnavailable,
                      "JL Mixing Automation was not found in its default install location or on PATH",
                  ),
                  Err(ApiCallError::IncompatibleVersion(version)) => blocked_client_operation(
                      ClientOperationCode::UnsupportedVersion,
                      &format!(
                          "JL Mixing Automation returned API {}; Studio requires Automation API 1.0",
                          version
                      ),
                  ),
                  Err(error) => blocked_client_operation(ClientOperationCode::Failed, &error.message()),
              }
          }

          fn rejected_client_api_response(
              response: crate::automation_api::ApiResponse,
              client: ClientCreationSummary,
          ) -> ClientOperationResult {
              let error = response.errors.first();
              let collision = error
                  .map(|item| item.code == "CLIENT_ALREADY_EXISTS")
                  .unwrap_or(false);
              let message = error
                  .map(|item| item.message.clone())
                  .unwrap_or_else(|| {
                      format!(
                          "JL Mixing Automation returned unexpected status {:?} for client.create",
                          response.status
                      )
                  });
              ClientOperationResult {
                  ok: false,
                  code: if collision {
                      ClientOperationCode::Collision
                  } else {
                      ClientOperationCode::Rejected
                  },
                  message,
                  client: Some(client),
              }
          }

          '''
          s = run_pattern.sub(replacement, s, count=1)

          arg_pattern = re.compile(r'''(?ms)^fn client_arguments\(.*?^}\n\n(?=fn studio_arguments)''')
          if not arg_pattern.search(s):
              raise SystemExit('client_arguments block not found')
          arg_replacement = r'''fn client_arguments(client: &ClientCreationSummary, operation: ClientOperation) -> Vec<String> {
              let mut arguments = vec![
                  "client".into(),
                  "create".into(),
                  client.client_id.clone(),
                  "--json".into(),
                  "--name".into(),
                  client.client_name.clone(),
              ];
              if let Some(artist) = &client.default_artist {
                  arguments.push("--artist".into());
                  arguments.push(artist.clone());
              }
              if matches!(operation, ClientOperation::Preflight) {
                  arguments.push("--dry-run".into());
              }
              arguments
          }

          '''
          s = arg_pattern.sub(arg_replacement, s, count=1)

          reject_pattern = re.compile(r'''(?ms)^fn rejected_operation\(.*?^}\n\n(?=fn rejected_studio_operation)''')
          if not reject_pattern.search(s):
              raise SystemExit('legacy rejected_operation block not found')
          s = reject_pattern.sub('', s, count=1)

          s = s.replace('resolve_command_with_path(home.path(), CLIENT_EXECUTABLE, None)', 'resolve_command_with_path(home.path(), AUTOMATION_EXECUTABLE, None)', 1)
          s = s.replace('Some(home.path().join(".local/bin").join(CLIENT_EXECUTABLE))', 'Some(home.path().join(".local/bin").join(AUTOMATION_EXECUTABLE))', 1)
          s = s.replace('std::fs::write(bin.join(CLIENT_EXECUTABLE), "managed launcher").unwrap();', 'std::fs::write(bin.join(AUTOMATION_EXECUTABLE), "managed launcher").unwrap();')
          # Remove the now-invalid client executable from installed_home's legacy command list.
          s = s.replace('            CLIENT_EXECUTABLE,\n', '', 1)

          helper_marker = '''    fn studio_request() -> StudioCreationRequest {'''
          if helper_marker not in s:
              raise SystemExit('test helper marker not found')
          helper = r'''    fn client_api_response(status: &str) -> io::Result<ProcessResult> {
              success(&format!(
                  r#"{{"api_version":"1.0","operation":"client.create","status":"{}","data":{{"client":{{"id":"acme-records","path":"/fixed/workspace/Clients/Acme Records"}},"configuration_path":"/fixed/workspace/Clients/Acme Records/client.json","workspace_path":"/fixed/workspace"}},"warnings":[],"errors":[]}}"#,
                  status
              ))
          }

          fn client_api_error(code: &str, message: &str) -> io::Result<ProcessResult> {
              Ok(ProcessResult {
                  success: false,
                  exit_code: Some(5),
                  stdout: format!(
                      r#"{{"api_version":"1.0","operation":"client.create","status":"blocked","data":{{}},"warnings":[],"errors":[{{"code":"{}","message":"{}","details":{{"exit_code":5}},"retryable":false}}]}}"#,
                      code, message
                  ),
                  stderr: String::new(),
              })
          }

          '''
          s = s.replace(helper_marker, helper + helper_marker, 1)

          s = s.replace('let runner = FakeRunner::new(vec![success("help"), success("preview")]);', 'let runner = FakeRunner::new(vec![success("help"), client_api_response("planned")]);', 1)
          s = s.replace('home.path().join(".local/bin/new-client")', 'home.path().join(".local/bin/jl-mixing")', 1)
          old_args = '''            vec![
                  "acme-records",
                  "--name",
                  "Acme Records",
                  "--artist",
                  "The Artist",
                  "--dry-run"
              ]'''
          new_args = '''            vec![
                  "client",
                  "create",
                  "acme-records",
                  "--json",
                  "--name",
                  "Acme Records",
                  "--artist",
                  "The Artist",
                  "--dry-run"
              ]'''
          if old_args not in s:
              raise SystemExit('preflight argument expectation not found')
          s = s.replace(old_args, new_args, 1)
          s = s.replace('let runner = FakeRunner::new(vec![success("help"), success("created")]);', 'let runner = FakeRunner::new(vec![success("help"), client_api_response("success")]);', 1)
          s = s.replace('vec!["acme-records", "--name", "Acme Records", "--no-cd"]', 'vec!["client", "create", "acme-records", "--json", "--name", "Acme Records"]', 1)
          s = s.replace('failure(4, "Client destination already exists")', 'client_api_error("CLIENT_ALREADY_EXISTS", "Client destination already exists")', 1)
          s = s.replace('fn reports_missing_new_client_separately()', 'fn reports_missing_api_provider_separately()', 1)
          s = s.replace('assert!(result.message.contains("new-client"));', 'assert!(result.message.contains("JL Mixing Automation"));', 1)

          cli.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Verify Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Commit migration and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/automation_api.rs src-tauri/src/cli.rs
          git rm .github/workflows/pr82-client-api-migration.yml
          git commit -m 'Migrate client creation to Automation API'
          git push
