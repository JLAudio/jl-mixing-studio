name: Fix PR80 Clippy
on:
  push:
    branches: [agent/automation-api-abstraction]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automation-api-abstraction
      - name: Scope test-only imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/cli.rs')
          s = p.read_text()
          s = s.replace('use std::env;\n', '#[cfg(test)]\nuse std::env;\n', 1)
          s = s.replace('use std::io;\n', '#[cfg(test)]\nuse std::io;\n', 1)
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/cli.rs
          git commit -m 'Fix test-only imports after Automation abstraction' || exit 0
          git push
