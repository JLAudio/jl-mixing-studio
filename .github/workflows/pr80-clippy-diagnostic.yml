name: PR80 Clippy Diagnostic
on:
  push:
    branches: [agent/automation-api-abstraction]
permissions:
  contents: write
jobs:
  clippy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automation-api-abstraction
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy and capture output
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings > pr80-clippy.log 2>&1
          echo $? > pr80-clippy-exit.txt
          exit 0
      - name: Commit diagnostic log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pr80-clippy.log pr80-clippy-exit.txt
          git commit -m 'Capture PR80 Clippy diagnostic output' || exit 0
          git push
