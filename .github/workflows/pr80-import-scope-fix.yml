name: Fix PR80 test-only imports
on:
  push:
    branches: [agent/automation-api-abstraction]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automation-api-abstraction
      - name: Scope test-only Automation imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/cli.rs')
          s = p.read_text()
          old = '''use crate::automation_api::{\n    automation_subprocess_path, resolve_command, resolve_command_with_path, ProcessResult,\n    ProcessRunner, SystemProcessRunner,\n};\n'''
          new = '''#[cfg(test)]\nuse crate::automation_api::{automation_subprocess_path, resolve_command_with_path, ProcessResult};\nuse crate::automation_api::{resolve_command, ProcessRunner, SystemProcessRunner};\n'''
          if old not in s:
              raise SystemExit('expected import block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fix and remove helper
        run: |
          rm -f .github/workflows/pr80-import-scope-fix.yml .pr80-import-scope-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/cli.rs .github/workflows/pr80-import-scope-fix.yml .pr80-import-scope-trigger
          git commit -m 'Scope Automation test imports correctly'
          git push
