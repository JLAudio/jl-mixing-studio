name: PR81 final test harness fix
on:
  push:
    branches: [agent/automation-api-discovery]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automation-api-discovery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix discovery test queue semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/cli.rs')
          s = p.read_text()
          old = '''            if arguments == ["system-info", "--json"] {
                return Ok(discovery_output());
            }
            self.results
                .borrow_mut()
                .pop_front()
                .expect("a fake process result")'''
          new = '''            let result = self
                .results
                .borrow_mut()
                .pop_front()
                .expect("a fake process result");
            if arguments == ["system-info", "--json"] {
                return match result {
                    Ok(output) if output.success => Ok(discovery_output()),
                    other => other,
                };
            }
            result'''
          if old not in s:
              raise SystemExit('FakeRunner discovery block not found')
          s = s.replace(old, new, 1)

          marker = '''    #[test]\n    fn unsupported_version_never_starts_new_client()'''
          start = s.find(marker)
          if start == -1:
              raise SystemExit('obsolete unsupported-version test not found')
          next_test = s.find('    #[test]\n', start + len(marker))
          if next_test == -1:
              raise SystemExit('cannot find end of unsupported-version test')
          s = s[:start] + s[next_test:]
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit harness fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/cli.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Align CLI test harness with API discovery'
          git push
