name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run Clippy and capture output
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings > pr80-clippy.log 2>&1
      - name: Upload Clippy diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr80-clippy-log
          path: pr80-clippy.log
      - name: Fail if Clippy failed
        if: steps.clippy.outcome == 'failure'
        run: exit 1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  clippy-report:
    name: Clippy diagnostic report
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr80-clippy-log
      - name: Print Clippy diagnostic
        run: cat pr80-clippy.log

  desktop-build:
    name: ${{ matrix.name }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
            artifact: DMG
          - name: macOS Apple Silicon
            os: macos-15
            artifact: DMG
          - name: Windows
            os: windows-latest
            artifact: NSIS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build ${{ matrix.artifact }} installer
        run: npm run tauri build
