name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrate-revision-create:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/revision-create-api-consumer' && github.actor != 'github-actions[bot]'
    name: Apply revision.create API migration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revision-create-api-consumer
          fetch-depth: 0
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          api = Path('src-tauri/src/automation_api.rs')
          text = api.read_text()
          text = text.replace(
              'revision_creation_supported: platform_supported && has("revision.create"),',
              'revision_creation_supported: platform_supported\n            && has("revision.create")\n            && has("revision.create.description"),'
          )
          text = text.replace(
              '"project.create.artist","revision.create","intake.validate"',
              '"project.create.artist","revision.create","revision.create.description","intake.validate"'
          )
          api.write_text(text)

          cli = Path('src-tauri/src/cli.rs')
          text = cli.read_text()
          text = text.replace('const REVISION_EXECUTABLE: &str = "new-revision";\n', '')

          start = text.index('fn run_revision_operation<R: ProcessRunner>(')
          end = text.index('\nfn run_approval_operation<R: ProcessRunner>(', start)
          replacement = r'''fn run_revision_operation<R: ProcessRunner>(
    home: &Path,
    project_directory: &Path,
    request: RevisionCreationRequest,
    operation: RevisionOperation,
    runner: &R,
) -> RevisionOperationResult {
    let request = match normalize_revision_request(request) {
        Ok(request) => request,
        Err(message) => {
            return blocked_revision_operation(RevisionOperationCode::InvalidInput, &message)
        }
    };

    let version = check_version_with_runner(home, runner);
    if !version.available {
        return blocked_revision_operation(
            RevisionOperationCode::AutomationUnavailable,
            &version.message,
        );
    }
    if !version.supported {
        return blocked_revision_operation(
            RevisionOperationCode::UnsupportedVersion,
            &version.message,
        );
    }
    if !version.revision_creation_supported {
        return blocked_revision_operation(
            RevisionOperationCode::Rejected,
            "JL Mixing Automation does not advertise the revision.create description capability required by Studio",
        );
    }

    let arguments = revision_arguments(project_directory, &request, operation);
    match invoke_api(home, "revision.create", &arguments, Some(project_directory), runner) {
        Ok(response)
            if matches!(
                (operation, response.status),
                (RevisionOperation::Preflight, ApiStatus::Planned)
                    | (RevisionOperation::Create, ApiStatus::Success)
            ) =>
        {
            let Some(revision) = revision_summary_from_api(&response.data, &request) else {
                return blocked_revision_operation(
                    match operation {
                        RevisionOperation::Preflight => RevisionOperationCode::Failed,
                        RevisionOperation::Create => RevisionOperationCode::Uncertain,
                    },
                    match operation {
                        RevisionOperation::Preflight => {
                            "The JL Mixing Automation revision preview could not be verified"
                        }
                        RevisionOperation::Create => {
                            "JL Mixing Automation reported success, but the new revision identity could not be verified. The operation may have completed; do not retry automatically."
                        }
                    },
                );
            };
            RevisionOperationResult {
                ok: true,
                code: match operation {
                    RevisionOperation::Preflight => RevisionOperationCode::Ready,
                    RevisionOperation::Create => RevisionOperationCode::Created,
                },
                message: match operation {
                    RevisionOperation::Preflight => {
                        "Revision preview completed. No changes were made."
                    }
                    RevisionOperation::Create => "Revision created successfully.",
                }
                .to_owned(),
                revision: Some(revision),
            }
        }
        Ok(response) => blocked_revision_operation(
            RevisionOperationCode::Rejected,
            &response
                .errors
                .first()
                .map(|error| error.message.clone())
                .unwrap_or_else(|| {
                    format!(
                        "JL Mixing Automation returned unexpected status {:?} for revision.create",
                        response.status
                    )
                }),
        ),
        Err(ApiCallError::Unavailable) => blocked_revision_operation(
            RevisionOperationCode::AutomationUnavailable,
            "JL Mixing Automation was not found in its default install location or on PATH",
        ),
        Err(ApiCallError::IncompatibleVersion(version)) => blocked_revision_operation(
            RevisionOperationCode::UnsupportedVersion,
            &format!(
                "JL Mixing Automation returned API {}; Studio requires Automation API 1.0",
                version
            ),
        ),
        Err(error) => blocked_revision_operation(
            match operation {
                RevisionOperation::Preflight => RevisionOperationCode::Failed,
                RevisionOperation::Create => RevisionOperationCode::Uncertain,
            },
            &error.message(),
        ),
    }
}

fn revision_summary_from_api(
    data: &serde_json::Value,
    request: &RevisionCreationRequest,
) -> Option<RevisionCreationSummary> {
    let project_id = data.get("project")?.get("id")?.as_str()?;
    let revision = data.get("revision")?;
    let number = revision.get("number")?.as_u64()?;
    let description = revision.get("description")?.as_str()?;
    if project_id != request.project_id
        || number == 0
        || number > u32::MAX as u64
        || description.trim().is_empty()
        || request
            .description
            .as_ref()
            .is_some_and(|expected| expected != description)
    {
        return None;
    }
    Some(RevisionCreationSummary {
        client_id: request.client_id.clone(),
        project_id: request.project_id.clone(),
        number: number as u32,
        description: description.to_owned(),
    })
}
'''
          text = text[:start] + replacement + text[end:]

          start = text.index('fn revision_arguments(')
          end = text.index('\nfn approval_arguments(', start)
          replacement = r'''fn revision_arguments(
    project_directory: &Path,
    request: &RevisionCreationRequest,
    operation: RevisionOperation,
) -> Vec<String> {
    let mut arguments = vec![
        "revision".into(),
        "create".into(),
        "--json".into(),
        "--project".into(),
        project_directory.to_string_lossy().into_owned(),
    ];
    if let Some(description) = &request.description {
        arguments.push("--description".into());
        arguments.push(description.clone());
    }
    if matches!(operation, RevisionOperation::Preflight) {
        arguments.push("--dry-run".into());
    }
    arguments
}
'''
          text = text[:start] + replacement + text[end:]

          start = text.index('fn parse_revision_output(')
          end = text.index('\nfn parse_approval_output(', start)
          text = text[:start] + text[end+1:]

          # Test fixtures: advertise new capability and return structured revision API responses.
          text = text.replace(
              '"project.create.artist","revision.create","intake.validate"',
              '"project.create.artist","revision.create","revision.create.description","intake.validate"'
          )
          marker = '    fn intake_request() -> IntakeRequest {'
          helper = r'''    fn revision_api_response(status: &str, description: &str) -> io::Result<ProcessResult> {
        success(&format!(
            r#"{{"api_version":"1.0","operation":"revision.create","status":"{}","data":{{"project":{{"id":"blue-sky","path":"/fixed/project"}},"revision":{{"number":3,"description":"{}","path":"/fixed/project/04_Revisions/Revision_03"}},"revision_notes_path":"/fixed/project/04_Revisions/Revision_03/Revision_Notes.md","workspace_path":"/fixed/workspace"}},"warnings":[],"errors":[]}}"#,
            status, description
        ))
    }

    fn revision_api_error(code: &str, message: &str) -> io::Result<ProcessResult> {
        Ok(ProcessResult {
            success: false,
            exit_code: Some(5),
            stdout: format!(
                r#"{{"api_version":"1.0","operation":"revision.create","status":"blocked","data":{{}},"warnings":[],"errors":[{{"code":"{}","message":"{}","details":{{"exit_code":5}},"retryable":false}}]}}"#,
                code, message
            ),
            stderr: String::new(),
        })
    }

'''
          text = text.replace(marker, helper + marker)

          text = text.replace('            REVISION_EXECUTABLE,\n', '')
          text = text.replace('success(&revision_output(true, "Vocal lift"))', 'revision_api_response("planned", "Vocal lift")')
          text = text.replace('success(&revision_output(false, "Revision 3"))', 'revision_api_response("success", "Revision 3")')
          text = text.replace('vec![success("help"), success("Revision created")]', 'vec![success("help"), success(r#"{"api_version":"1.0","operation":"revision.create","status":"success","data":{"project":{"id":"blue-sky","path":"/fixed/project"},"revision":{"number":3,"path":"/fixed/project/04_Revisions/Revision_03"}},"warnings":[],"errors":[]}"#)]')
          text = text.replace('failure(4, "Revision destination already exists")', 'revision_api_error("REVISION_ALREADY_EXISTS", "Revision destination already exists")')
          text = text.replace('home.path().join(".local/bin/new-revision")', 'home.path().join(".local/bin/jl-mixing")')
          text = text.replace('vec!["--description", "Vocal lift", "--dry-run"]', 'vec!["revision", "create", "--json", "--project", "/fixed/project", "--description", "Vocal lift", "--dry-run"]')
          text = text.replace('assert_eq!(runner.invocations.borrow()[1].arguments, vec!["--no-cd"]);', 'assert_eq!(runner.invocations.borrow()[1].arguments, vec!["revision", "create", "--json", "--project", "/fixed/project"]);')

          cli.write_text(text)
          PY
      - name: Verify migration
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Commit migration and restore CI
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/automation_api.rs src-tauri/src/cli.rs .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "Migrate revision creation to Automation API"
          git push origin HEAD:agent/revision-create-api-consumer

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  desktop-build:
    name: ${{ matrix.name }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
            artifact: DMG
          - name: macOS Apple Silicon
            os: macos-15
            artifact: DMG
          - name: Windows
            os: windows-latest
            artifact: NSIS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build ${{ matrix.artifact }} installer
        run: npm run tauri build
