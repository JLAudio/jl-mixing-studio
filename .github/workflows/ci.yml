name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-copy-final-audit
      - name: Apply final PR 108 test update once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.test.tsx')
          text = path.read_text()
          old = 'expect(screen.getByRole("alert")).toHaveTextContent(/may have completed/i);'
          new = 'expect(screen.getByRole("alert")).toHaveTextContent(/result is uncertain/i);'
          marker = 'expect(await screen.findByRole("alert")).toHaveTextContent(/studio could not be refreshed/i);\n    ' + old
          replacement = 'expect(await screen.findByRole("alert")).toHaveTextContent(/studio could not be refreshed/i);\n    ' + new
          if marker not in text:
              raise SystemExit('target assertion not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.test.tsx .github/workflows/ci.yml
          git commit -m "Update final UI copy test assertion"
          git push origin HEAD:agent/ui-copy-final-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  desktop-check:
    name: ${{ matrix.name }} compile check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check desktop compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-features
