name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-pr80:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automation-api-abstraction
          fetch-depth: 0
      - name: Restore source and apply exact import fix
        shell: bash
        run: |
          set -euo pipefail
          git show abafe1358746c6f8b4f2050af9130a536ca7a137:src-tauri/src/cli.rs > src-tauri/src/cli.rs
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/cli.rs')
          s = p.read_text()
          old = '''#[cfg(test)]\nuse crate::automation_api::{automation_subprocess_path, resolve_command_with_path, ProcessResult};\nuse crate::automation_api::{resolve_command, ProcessRunner, SystemProcessRunner};'''
          new = '''#[cfg(test)]\nuse crate::automation_api::{automation_subprocess_path, resolve_command_with_path};\nuse crate::automation_api::{resolve_command, ProcessResult, ProcessRunner, SystemProcessRunner};'''
          if old not in s:
              raise SystemExit('expected import block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/pr80-clippy-diagnostic.yml pr80-clippy.log pr80-clippy-exit.txt
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit repaired branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Repair PR80 source and restore normal CI'
          git push
