name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-copy-final-audit
      - name: Apply final UI copy audit once
        run: |
          if [ -f scripts/final_ui_copy_audit.py ]; then
            python scripts/final_ui_copy_audit.py
            rm scripts/final_ui_copy_audit.py
            python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          text = p.read_text()
          text = text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read')
          start = text.index('      - name: Apply final UI copy audit once\n')
          end = text.index('      - uses: actions/setup-node@v4\n', start)
          text = text[:start] + text[end:]
          text = text.replace('      - uses: actions/checkout@v4\n        with:\n          ref: agent/ui-copy-final-audit\n', '      - uses: actions/checkout@v4\n', 1)
          p.write_text(text)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/App.test.tsx scripts/final_ui_copy_audit.py .github/workflows/ci.yml
            git commit -m "Complete final UI copy audit"
            git push origin HEAD:agent/ui-copy-final-audit
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  desktop-check:
    name: ${{ matrix.name }} compile check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check desktop compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-features
