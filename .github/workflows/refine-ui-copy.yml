name: One-time UI copy refinement

on:
  push:
    branches:
      - agent/ui-copy-workflow-pass
    paths:
      - scripts/refine-ui-copy.py
      - .github/workflows/refine-ui-copy.yml

permissions:
  contents: write

jobs:
  refine-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-copy-workflow-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refine UI copy
        run: python scripts/refine-ui-copy.py
      - name: Commit refined copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes generated"
            exit 1
          fi
          git commit -m "Refine workflow UI copy"
          git push origin HEAD:agent/ui-copy-workflow-pass
